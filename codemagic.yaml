# Codemagic CI/CD — build iOS de Safe CRM (wrapper Capacitor)
#
# Firma manual vía App Store Connect API, igual que mobile_meli/codemagic.yaml
# (ese enfoque es el que probadamente funciona para las apps de ClickBI —
# el signing automático de Codemagic con "ios_signing:" dio problemas acá).
#
# Cada build genera un .ipa y lo sube a TestFlight automáticamente.

workflows:
  ios-safe-crm:
    name: Safe CRM iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: clickbi-appstore
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cl.clickbi.safecopec"
      node: "22"
      xcode: latest
    scripts:
      - name: Dependencias npm
        script: npm install
      - name: Sync Capacitor a iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize

          openssl genrsa -out /tmp/cert-key.pem 2048

          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/cert-key.pem \
            --save

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert-key.pem \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Para la demo basta TestFlight interno. Para producción como Custom
        # App B2B hacia Copec: cambiar en App Store Connect la distribución a
        # privada (Apple Business Manager) — no por aquí.
      email:
        recipients:
          - bgonzalezc@clickbi.cl
