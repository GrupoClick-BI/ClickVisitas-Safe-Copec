# Codemagic CI/CD — build iOS de Safe CRM (wrapper Capacitor)
#
# Preparación:
#   1. Subir este proyecto a un repo git (GitHub/GitLab/Bitbucket) y conectarlo
#      a Codemagic (Add application).
#   2. En Codemagic → Teams/Personal → Integrations → App Store Connect:
#      reutiliza la integración "clickbi-appstore" (ya registrada para otros
#      proyectos de ClickBI, ver mobile_meli/codemagic.yaml) o crea una API key
#      en App Store Connect (Users and Access → Keys) con rol Developer/App
#      Manager y regístrala con ese mismo nombre.
#   3. Codemagic gestiona certificados y provisioning automáticamente
#      (ios_signing + xcode-project use-profiles).
#
# Cada build genera un .ipa y lo sube a TestFlight automáticamente.

workflows:
  ios-safe-crm:
    name: Safe CRM iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cl.clickbi.safecopec"
      node: "22"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
    integrations:
      app_store_connect: clickbi-appstore
    scripts:
      - name: Dependencias npm
        script: npm install
      - name: Sync Capacitor a iOS
        script: npx cap sync ios
      - name: Perfiles de firma (App Store Connect)
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Para la demo basta TestFlight interno. Para producción como Custom
        # App B2B hacia Copec: cambiar en App Store Connect la distribución a
        # privada (Apple Business Manager) — no por aquí.
      email:
        recipients:
          - itapia@clickbi.cl
          - bgonzalezc@clickbi.cl
