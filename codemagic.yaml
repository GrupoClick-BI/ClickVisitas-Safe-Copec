# Codemagic CI/CD — build iOS/Android de Safe CRM (wrapper Capacitor)
#
# iOS: firma manual vía App Store Connect API, igual que mobile_meli/codemagic.yaml
# (ese enfoque es el que probadamente funciona para las apps de ClickBI —
# el signing automático de Codemagic con "ios_signing:" dio problemas acá).
# El certificado de distribución se REUTILIZA desde la variable de entorno
# IOS_CERTIFICATE_PRIVATE_KEY (grupo "ios_signing") en vez de crear uno nuevo
# en cada build — antes agotaba los 3 certificados de distribución de Apple.
# Ver NEW_PROJECT_CHECKLIST.md en PROYECTOS/_templates/capacitor-wrapper/.
# El build number se calcula solo (get-latest-build-number + agvtool), no se
# edita a mano. Cada build de iOS genera un .ipa y lo sube a TestFlight.
#
# Android: build debug (sin firma), igual que mobile_meli/codemagic.yaml.
# Genera un .apk instalable directo para pruebas.

workflows:
  android-safe-crm:
    name: Safe CRM Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: "22"
      java: 17
      vars:
        PACKAGE_NAME: "cl.clickbi.safecopec"
    scripts:
      - name: Dependencias npm
        script: npm install
      - name: Agregar plataforma Android si falta
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor a Android
        script: npx cap sync android
      - name: Agregar permisos de audio al manifest
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i '' 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$MANIFEST"
          fi
      - name: Permisos de gradlew
        script: chmod +x android/gradlew
      - name: Build APK Android (debug)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - bgonzalezc@clickbi.cl

  ios-safe-crm:
    name: Safe CRM iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: clickbi-appstore
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cl.clickbi.safecopec"
        APP_STORE_APPLE_ID: "6814484016"
      node: "22"
      xcode: latest
    scripts:
      - name: Dependencias npm
        script: npm install
      - name: Sync Capacitor a iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize

          # Reutiliza el certificado guardado en la variable de entorno
          # IOS_CERTIFICATE_PRIVATE_KEY (grupo "ios_signing"). Si todavía no
          # existe (primer run / bootstrap), genera uno nuevo — ver el paso
          # "Bootstrap: exportar llave" más abajo para guardarlo una sola vez.
          if [ -n "$IOS_CERTIFICATE_PRIVATE_KEY" ]; then
            echo "$IOS_CERTIFICATE_PRIVATE_KEY" | base64 -d > /tmp/cert-key.pem
          else
            openssl genrsa -out /tmp/cert-key.pem 2048
          fi

          # fetch-signing-files reutiliza el certificado existente que calce
          # con esta llave; solo crea uno nuevo si --create y no hay ninguno.
          # NO llamar a "certificates create" acá: eso crea uno nuevo SIEMPRE
          # y fue lo que agotó los 3 certificados de distribución de Apple.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert-key.pem \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: "Bootstrap: exportar llave (borrar tras guardar IOS_CERTIFICATE_PRIVATE_KEY)"
        script: |
          if [ -z "$IOS_CERTIFICATE_PRIVATE_KEY" ]; then
            base64 -i /tmp/cert-key.pem -o "$CM_BUILD_DIR/cert-key.pem.b64"
            echo "Descarga cert-key.pem.b64 de los artifacts y guárdalo como"
            echo "variable de entorno segura IOS_CERTIFICATE_PRIVATE_KEY"
            echo "(grupo ios_signing) en Codemagic. Luego borra este paso y"
            echo "la línea de artifact cert-key.pem.b64 de este archivo."
          fi
      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo "0")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - cert-key.pem.b64 # bootstrap: borrar esta línea tras guardar IOS_CERTIFICATE_PRIVATE_KEY
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Para la demo basta TestFlight interno. Para producción como Custom
        # App B2B hacia Copec: cambiar en App Store Connect la distribución a
        # privada (Apple Business Manager) — no por aquí.
      email:
        recipients:
          - bgonzalezc@clickbi.cl
